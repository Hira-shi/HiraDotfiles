font_size 16.0
font_family FiraCode Nerd Font
include keybindings.conf

background_opacity 0.8
background_blur 10
dynamic_background_opacity yes

# Kanagawa Dragon Color Scheme
foreground #c5c9c5
background #181616
selection_foreground #c8c093
selection_background #2d4f67

# Normal colors
color0  #0d0c0c
color1  #c4746e
color2  #8a9a7b
color3  #c4b28a
color4  #8ba4b0
color5  #a292a3
color6  #8ea4a2
color7  #c8c093

# Bright colors
color8  #a6a69c
color9  #e46876
color10 #87a987
color11 #e6c384
color12 #7fb4ca
color13 #938aa9
color14 #7aa89f
color15 #c5c9c5

# Extended colors
color16 #b6927b
color17 #b98d7b

# Cursor colors
cursor #c8c093
cursor_text_color #181616

# URL colors
url_color #72a7bc

# Tab bar colors
active_tab_foreground #c8c093
active_tab_background #12120f
inactive_tab_foreground #a6a69c
inactive_tab_background #12120f
